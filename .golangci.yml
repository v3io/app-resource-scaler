version: "2"

run:
  # timeout for analysis
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - goconst
    - gocritic
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  settings:
    gocritic:
      disabled-checks:
        - commentFormatting # we dont want to enforce space before the comment text
    revive:
      rules:
        # avoid  errorf: should replace errors.New(fmt.Sprintf(...)) with fmt.Errorf(...)  messages
        - name: errorf
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # list of excluded linters applied on test files
      - linters:
          - goconst
        path: _test\.go
      - path: (.+)\.go$
        text: comment on
      - path: (.+)\.go$
        text: error should be the last
    paths:
      - hack
formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/v3io/app-resource-scaler)
        - default
        - blank
        - dot
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - hack
